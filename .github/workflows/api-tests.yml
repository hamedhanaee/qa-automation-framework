name: Automated tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify formatting
        run: ruff format --check .

      - name: Run lint checks
        run: ruff check .

      - name: Run API tests
        run: pytest tests/api tests/unit -v --html=reports/api.html --self-contained-html --junitxml=reports/api-junit.xml

      - name: Run UI tests
        run: pytest tests/ui -v --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results --html=reports/ui.html --self-contained-html --junitxml=reports/ui-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: warn
