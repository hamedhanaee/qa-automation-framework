name: Automated tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: Select which test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - ui

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SELECTED_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API test dependencies
        if: env.SELECTED_SCOPE == 'api'
        run: |
          python -m pip install --no-deps -e .
          python -m pip install \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.0,<9.0" \
            "pytest-html>=4.1,<5.0" \
            "requests>=2.32,<3.0" \
            "ruff>=0.12,<1.0"

      - name: Install project and test dependencies
        if: env.SELECTED_SCOPE != 'api'
        run: python -m pip install -e .

      - name: Install Chromium
        if: env.SELECTED_SCOPE != 'api'
        run: python -m playwright install --with-deps chromium

      - name: Verify formatting
        run: ruff format --check .

      - name: Run lint checks
        run: ruff check .

      - name: Run API and unit tests
        if: env.SELECTED_SCOPE != 'ui'
        run: pytest tests/api tests/unit -v --html=reports/api.html --self-contained-html --junitxml=reports/api-junit.xml

      - name: Run UI tests
        if: env.SELECTED_SCOPE != 'api'
        run: pytest tests/ui -v --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results --html=reports/ui.html --self-contained-html --junitxml=reports/ui-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-artifacts-${{ env.SELECTED_SCOPE }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
