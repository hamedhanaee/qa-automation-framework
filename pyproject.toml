[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-api-automation-framework"
version = "0.1.0"
description = "Pytest-based API automation framework"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5.0",
    "pytest>=8.0,<9.0",
    "pytest-html>=4.1,<5.0",
    "requests>=2.32,<3.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
log_level = "INFO"
markers = [
    "regression: complete API behavior coverage",
    "smoke: fast checks for API availability and the core response contract",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
