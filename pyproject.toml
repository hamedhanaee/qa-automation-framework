[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-api-automation-framework"
version = "0.1.0"
description = "Pytest-based API automation framework"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0,<9.0",
    "pytest-html>=4.1,<5.0",
    "requests>=2.32,<3.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

